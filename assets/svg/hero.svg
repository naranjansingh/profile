<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Animated hero for Naranjan Singh</title><desc id="desc">Dark luxury glassmorphism hero with animated gradients, particles, grid, Flutter mark, and typing roles.</desc>
<style>
@keyframes gradientShift{0%,100%{stop-color:#42A5F5}50%{stop-color:#00D4FF}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}@keyframes drift{0%{transform:translateX(-40px);opacity:.1}50%{opacity:.75}100%{transform:translateX(1240px);opacity:.1}}@keyframes pulse{0%,100%{opacity:.35;r:3}50%{opacity:1;r:5}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes cursor{0%,45%{opacity:1}46%,100%{opacity:0}}@keyframes role{0%,12%{content:"Flutter Developer"}16%,28%{content:"Android Developer"}32%,44%{content:"iOS Developer"}48%,60%{content:"Firebase Developer"}64%,76%{content:"REST API Integration"}80%,100%{content:"Building Production Mobile Applications"}}.bg{fill:#05070D}.glass{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);stroke-width:1}.grid{stroke:#fff;stroke-opacity:.055}.headline{font:800 74px Inter,Segoe UI,Arial,sans-serif;letter-spacing:-3px;fill:#fff}.eyebrow{font:600 24px Inter,Segoe UI,Arial,sans-serif;fill:#A7C9FF}.role{font:700 31px Inter,Segoe UI,Arial,sans-serif;fill:#00D4FF}.body{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#B7C1D6}.line{stroke:url(#line);stroke-width:2;stroke-linecap:round;stroke-dasharray:500;stroke-dashoffset:500;animation:draw 4s ease forwards infinite}.particle{animation:pulse 3s ease-in-out infinite}.drift{animation:drift 12s linear infinite}.float{animation:float 6s ease-in-out infinite}.typing:before{content:"Flutter Developer";animation:role 15s steps(1,end) infinite}.cursor{animation:cursor 1s step-end infinite}</style>
<defs><radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop stop-color="#00D4FF" stop-opacity=".45"/><stop offset="1" stop-color="#05070D" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" y1="0" x2="1200" y2="420"><stop stop-color="#42A5F5"><animate attributeName="stop-color" values="#42A5F5;#00D4FF;#7C3AED;#42A5F5" dur="9s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#7C3AED"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="30"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="1200" height="420" rx="28"/><g class="grid"> <path d="M0 70h1200M0 140h1200M0 210h1200M0 280h1200M0 350h1200M100 0v420M200 0v420M300 0v420M400 0v420M500 0v420M600 0v420M700 0v420M800 0v420M900 0v420M1000 0v420M1100 0v420"/></g>
<circle cx="975" cy="96" r="130" fill="url(#halo)" filter="url(#blur)"/><circle cx="170" cy="334" r="110" fill="#7C3AED" opacity=".2" filter="url(#blur)"/><path class="line" d="M58 304C210 219 288 374 430 277S684 125 858 198 1038 229 1143 112" opacity=".55"/>
<g class="drift"><path d="M0 118h190" stroke="#00D4FF" stroke-opacity=".34"/><path d="M-90 248h130" stroke="#7C3AED" stroke-opacity=".34"/></g>
<g class="float"><rect x="58" y="54" width="660" height="304" rx="26" class="glass"/><text x="94" y="116" class="eyebrow">Hi 👋  I'm</text><text x="92" y="194" class="headline">Naranjan Singh</text><text x="94" y="248" class="role">&lt;<tspan class="typing"></tspan><tspan class="cursor">_</tspan>/&gt;</text><text x="96" y="304" class="body">3+ years building elegant, production-grade mobile experiences from Punjab, India.</text></g>
<g class="float" style="animation-delay:-2s" filter="url(#glow)"><path d="M910 91l-92 92 56 56 148-148H910z" fill="#42A5F5"/><path d="M876 241l39 39h110l-94-94-55 55z" fill="#00D4FF"/><path d="M914 280l-55-55-40 40 15 15h80z" fill="#7C3AED" opacity=".9"/></g>
<g fill="#fff"> <circle class="particle" cx="782" cy="70" r="3"/><circle class="particle" cx="1074" cy="295" r="3" style="animation-delay:-1s"/><circle class="particle" cx="665" cy="365" r="3" style="animation-delay:-2s"/><circle class="particle" cx="112" cy="80" r="3" style="animation-delay:-.5s"/></g>
</svg>
