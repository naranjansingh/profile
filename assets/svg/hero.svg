<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Naranjan Singh animated Flutter Engineer hero</title>
<desc id="desc">Premium dark animated hero with glassmorphism, particles, scrolling marquee, metrics, and compact Flutter mark.</desc>
<style>
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes drift{0%{transform:translateX(-220px)}100%{transform:translateX(1220px)}}@keyframes pulse{0%,100%{opacity:.32;r:3}50%{opacity:1;r:5}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-520px)}}.bg{fill:#05070D}.glass{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.16);stroke-width:1}.grid{stroke:#fff;stroke-opacity:.055}.hi{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#A7C9FF}.name{font:900 78px Inter,Segoe UI,Arial,sans-serif;letter-spacing:-3px;fill:#fff}.role{font:800 38px Inter,Segoe UI,Arial,sans-serif;fill:#00D4FF}.copy{font:600 21px Inter,Segoe UI,Arial,sans-serif;fill:#DCE7FF}.chip{font:800 16px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.tiny{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#AAB7D0;letter-spacing:.7px}.line{stroke:url(#line);stroke-width:2;stroke-linecap:round;stroke-dasharray:620;stroke-dashoffset:620;animation:draw 4s ease forwards infinite}.particle{animation:pulse 3s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}.marquee{animation:marquee 16s linear infinite}.drift{animation:drift 14s linear infinite}</style>
<defs><radialGradient id="halo"><stop stop-color="#00D4FF" stop-opacity=".48"/><stop offset="1" stop-color="#05070D" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" y1="0" x2="1200" y2="460"><stop stop-color="#42A5F5"><animate attributeName="stop-color" values="#42A5F5;#00D4FF;#7C3AED;#42A5F5" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#7C3AED"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="30"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect class="bg" width="1200" height="460" rx="30"/><g class="grid"><path d="M0 76h1200M0 152h1200M0 228h1200M0 304h1200M0 380h1200M100 0v460M200 0v460M300 0v460M400 0v460M500 0v460M600 0v460M700 0v460M800 0v460M900 0v460M1000 0v460M1100 0v460"/></g>
<circle cx="970" cy="96" r="135" fill="url(#halo)" filter="url(#blur)"/><circle cx="164" cy="356" r="115" fill="#7C3AED" opacity=".2" filter="url(#blur)"/><path class="line" d="M56 332C222 230 310 404 468 290S730 138 902 212 1046 220 1140 118" opacity=".55"/>
<g class="drift"><path d="M0 126h220" stroke="#00D4FF" stroke-opacity=".3"/><path d="M-140 260h150" stroke="#7C3AED" stroke-opacity=".32"/></g>
<g class="float"><rect x="58" y="48" width="770" height="334" rx="28" class="glass"/><text x="96" y="112" class="hi">Hi 👋</text><text x="94" y="194" class="name">Naranjan Singh</text><text x="96" y="250" class="role">Flutter Engineer</text><text x="96" y="302" class="copy">Building apps used by thousands of users.</text><text x="96" y="334" class="copy">Crafting scalable Android &amp; iOS applications with Flutter.</text></g>
<g class="float" style="animation-delay:-1.8s" filter="url(#glow)"><rect x="890" y="72" width="214" height="214" rx="42" class="glass"/><path d="M980 126l-62 62 38 38 100-100h-76z" fill="#42A5F5"/><path d="M957 228l27 27h74l-63-63-38 36z" fill="#00D4FF"/><path d="M983 255l-37-37-27 27 10 10h54z" fill="#7C3AED"/><text x="997" y="326" text-anchor="middle" class="tiny">PRODUCTION READY</text></g>
<g><rect x="92" y="392" width="150" height="38" rx="19" class="glass"/><text x="167" y="416" text-anchor="middle" class="chip">3+ Years</text><rect x="258" y="392" width="194" height="38" rx="19" class="glass"/><text x="355" y="416" text-anchor="middle" class="chip">Production Apps</text><rect x="468" y="392" width="260" height="38" rx="19" class="glass"/><text x="598" y="416" text-anchor="middle" class="chip">Available for Remote Opportunities</text></g>
<clipPath id="clip"><rect x="760" y="392" width="360" height="38" rx="19"/></clipPath><rect x="760" y="392" width="360" height="38" rx="19" class="glass"/><g clip-path="url(#clip)"><g class="marquee"><text x="782" y="416" class="chip">Flutter • Firebase • Clean Architecture • REST APIs • Real-time Apps • Payment Integration • Flutter • Firebase • Clean Architecture • REST APIs</text></g></g>
<g fill="#fff"><circle class="particle" cx="778" cy="74" r="3"/><circle class="particle" cx="1110" cy="306" r="3" style="animation-delay:-1s"/><circle class="particle" cx="668" cy="368" r="3" style="animation-delay:-2s"/><circle class="particle" cx="114" cy="82" r="3" style="animation-delay:-.5s"/></g>
</svg>
